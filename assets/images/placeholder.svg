<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Project preview placeholder</title>
  <desc id="desc">Simple placeholder graphic for project screenshots.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" rx="24" />
  <g fill="none" stroke="rgba(255,255,255,0.18)">
    <circle cx="160" cy="120" r="56" />
    <circle cx="1040" cy="540" r="96" />
    <path d="M120 560c120-120 240-180 360-180s240 60 360 180" />
  </g>
  <g fill="#fff" font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="290" font-size="52" font-weight="700">Project Preview</text>
    <text x="600" y="350" font-size="24" opacity="0.85">Screenshot coming soon</text>
  </g>
</svg>
